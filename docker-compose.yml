services:
  novel-webui:
    image: translator_webui-webui:latest
    build: .
    container_name: novel-webui
    init: true
    ports:
      # Docker 会绕过 ufw，只绑本机，由 nginx 反代
      - "127.0.0.1:${WEBUI_PORT:-7860}:7860"
    env_file:
      - .env
    volumes:
      - ./data:/data
    restart: always
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/healthz', timeout=3)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
